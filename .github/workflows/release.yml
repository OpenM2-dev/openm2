name: release

# A tag vX.Y.Z publishes a release: the server's image to
# GHCR, ghcr.io/<owner>/openm2-server:X.Y.Z, and the Windows client with its
# launcher to a GitHub Release with its SHA-256, the release's notes starting
# with the changelog since the previous tag. The release is also the
# launcher's update channel (deploy/windows/launcher.toml): its downloads
# carry the version's files by their SHA-256 and the manifest signed with
# OPENM2_RELEASE_KEY, the `release` environment's secret. The tag must be
# the workspace's version.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job that writes says so.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    # Each job has a time limit under GitHub's 6 hours, so a hung one fails.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Third-party actions are pinned by commit SHA; the comment gives the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag $TAG is not v$version, the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server-image:
    name: server image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The source label links the package to this repository.
      - name: Build the image
        run: |
          image="ghcr.io/${OWNER,,}/openm2-server"
          docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$image:$VERSION" .
          test "$(docker run --rm "$image:$VERSION" --version)" = "openm2-server $VERSION"

      - id: push
        name: Push it
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${OWNER,,}/openm2-server"
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$image:$VERSION"
          docker logout ghcr.io
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

  # Built without a cache, from the tag's sources alone.
  client-windows:
    name: Windows client
    needs: version
    # The release key's secret is only given to jobs of this environment.
    environment: release
    runs-on: windows-latest
    # Fat LTO in one codegen unit, with no cache, is the slowest build.
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Build the client and its launcher
        run: cargo build --locked --profile dist --package m2-cli --bin openm2 --package m2-launcher --bin openm2-launcher

      # The version's files: what the channel's manifest names, and the zip
      # holds with launcher.toml beside them.
      - name: The version's files
        shell: pwsh
        run: |
          New-Item -ItemType Directory version | Out-Null
          Copy-Item target/dist/openm2.exe, target/dist/openm2-launcher.exe, LICENSE-MIT, LICENSE-APACHE, README.md version
          # The licences of every package the programs are built from.
          cargo xtask notices --out "version/THIRD-PARTY-NOTICES.txt"
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask notices failed" }
          foreach ($program in "openm2", "openm2-launcher") {
            # Piped: the launcher is a Windows-subsystem program, whose
            # output PowerShell reads, and waits for, only then.
            $printed = (& "version/$program.exe" --version | Out-String).Trim()
            if ($printed -ne "$program $env:VERSION") { throw "$program --version printed: $printed" }
          }

      # The channel, flat as a release's downloads are: each file once by its
      # SHA-256, and the signed manifest, checked with the key launchers have.
      # A year before it expires, so releases months apart still update.
      - name: Sign the channel's manifest
        shell: pwsh
        env:
          OPENM2_RELEASE_KEY: ${{ secrets.OPENM2_RELEASE_KEY }}
        run: |
          if (-not $env:OPENM2_RELEASE_KEY) { throw "the release environment has no OPENM2_RELEASE_KEY" }
          $channel = "windows-x64"
          & version/openm2.exe release manifest --dir version --channel $channel --version $env:VERSION --days 365 --objects channel --out manifest.json
          if ($LASTEXITCODE -ne 0) { throw "release manifest failed" }
          & version/openm2.exe release sign manifest.json --out "channel/$channel.manifest.signed"
          if ($LASTEXITCODE -ne 0) { throw "release sign failed" }
          $key = (Select-String -Path deploy/windows/launcher.toml -Pattern '^key = "(.+)"$').Matches[0].Groups[1].Value
          & version/openm2.exe release verify "channel/$channel.manifest.signed" --key $key --channel $channel
          if ($LASTEXITCODE -ne 0) { throw "the manifest isn't signed with deploy/windows/launcher.toml's key" }

      - name: Zip it
        shell: pwsh
        run: |
          $name = "openm2-$env:VERSION-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item version/*, deploy/windows/launcher.toml $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLowerInvariant()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-windows
          path: |
            openm2-*-windows-x64.zip*
            channel/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [version, server-image, client-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The whole history and its tags, for the changelog since the previous
      # release. Before the download: checkout empties the folder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-windows

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # The commits since the previous v* tag, grouped by type (`just changelog`).
      - name: The changelog
        env:
          TAG: ${{ github.ref_name }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: cargo xtask changelog "$TAG" --repo-url "$SOURCE" > changelog.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.server-image.outputs.image }}
          DIGEST: ${{ needs.server-image.outputs.digest }}
        run: |
          cp changelog.md notes.md
          cat >> notes.md <<EOF

          ## Downloads
          The server's image: \`$IMAGE:$VERSION\`, digest \`$DIGEST\`
          (\`docker pull $IMAGE@$DIGEST\`).

          The Windows client and its launcher: \`openm2-$VERSION-windows-x64.zip\`, with its SHA-256 beside it.
          Unzip it anywhere and start \`openm2-launcher.exe\`: it imports your own client once, then keeps
          itself and the game up to date from the latest release. The downloads named by a SHA-256, and
          \`windows-x64.manifest.signed\`, are that update channel: the programs only, never a client's files.
          EOF
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "openm2 $VERSION" \
            --notes-file notes.md openm2-*-windows-x64.zip openm2-*-windows-x64.zip.sha256 channel/*
