  { name = "parts", type = "[u16; 4]", doc = "What it wears, as in EntityUpdate." },
  { name = "empire", type = "u8", doc = "0 none, 1 Shinsoo, 2 Chunjo, 3 Jinno." },
  { name = "guild", type = "u32", doc = "Guild id; 0 for none." },
  { name = "level", type = "u8", doc = "Level; 0 for NPCs." },
]

