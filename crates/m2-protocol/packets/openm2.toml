  { name = "move_speed", type = "u8", doc = "Movement speed, as in EntitySpawn." },
  { name = "attack_speed", type = "u8", doc = "Attack speed, as in EntitySpawn." },
  { name = "state", type = "u8", doc = "Flags, as in EntitySpawn." },
  { name = "affects", type = "u64", doc = "Effects shown, as in EntitySpawn." },
  { name = "guild", type = "u32", doc = "Guild id; 0 for none." },
]

